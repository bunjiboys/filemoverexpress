version: '3'

vars:
  OUTPUT_DIR: dist
  BUILD_VERSION: '{{.BUILD_VERSION | default "0.0.0-local-dev"}}'

includes:
  cli:
    taskfile: src/cli/Taskfile.yml
    dir: src/cli
    vars:
      BUILD_VERSION: '{{.BUILD_VERSION}}'
  gui:
    taskfile: src/gui/Taskfile.yml
    dir: src/gui
  proto:
    taskfile: src/protobuf/Taskfile.yml
    dir: src/protobuf
  wails:
    taskfile: src/wails/Taskfile.yml
    dir: src/wails
    vars:
      BUILD_VERSION: '{{.BUILD_VERSION}}'
  launcher:
    taskfile: src/windows-daemon-launcher/Taskfile.yml
    dir: src/windows-daemon-launcher
  workflow-builder:
    taskfile: src/workflow-builder/Taskfile.yml
    dir: src/workflow-builder

tasks:
  # ====================
  # Generate
  # ====================

  generate:
    desc: Run all code generation
    deps: [proto:generate, generate:wails-bindings]

  generate:wails-bindings:
    desc: Generate Wails bindings for the frontend
    dir: src/wails
    cmds:
      - wails3 generate bindings -clean=true -ts -d ../gui/src/gen/wails
    sources:
      - '**/*.go'
    generates:
      - ../gui/src/gen/wails/**/*.ts

  # ====================
  # Build
  # ====================

  build:
    desc: Build CLI, GUI, and Wails app
    cmds:
      - task: build:cli
      # build:wails builds the GUI as part of packaging the desktop app.
      - task: build:wails

  build:cli:
    desc: Build CLI for the current platform
    deps: [proto:generate]
    cmds:
      - task: cli:build
      - task: launcher:build

  build:cli:all:
    desc: Build CLI for all platforms
    deps: [proto:generate]
    cmds:
      - task: cli:build:all
      - task: launcher:build

  build:gui:
    desc: Build Angular GUI (production)
    deps: [generate:wails-bindings]
    cmds:
      - task: gui:build

  build:wails:
    desc: Build the Wails desktop application
    deps: [generate, build:cli]
    cmds:
      - task: wails:build

  dev:
    desc: Run Wails in development mode
    deps: [generate, build:cli]
    dir: src/wails
    cmds:
      - wails3 dev

  # ====================
  # Test
  # ====================

  test:
    desc: Run all tests
    cmds:
      - task: cli:test
      - task: test:wails
      - task: gui:test
      - task: workflow-builder:test

  e2e:workflow-builder:
    desc: Run the Workflow Builder Tier-2 Playwright E2E suite (separate from the unit gate)
    dir: src/workflow-builder
    cmds:
      - npm run e2e

  build:workflow-builder:
    desc: Build the Workflow Builder static site
    cmds:
      - task: workflow-builder:build

  test:wails:
    desc: Run Wails Go tests
    dir: src/wails
    cmds:
      - go test -gcflags="all=-N -l" -short -v -cover -coverprofile coverage.out ./...
      - go tool cover -html coverage.out -o coverage.html

  # ====================
  # Lint
  # ====================

  lint:
    desc: Run all linters in parallel
    deps: [cli:lint, gui:lint, workflow-builder:lint]

  # ====================
  # Clean
  # ====================

  clean:
    desc: Remove build artifacts and generated code
    cmds:
      - |
        {{if eq OS "windows"}}
        powershell -NoProfile -Command "Remove-Item -Recurse -Force -ErrorAction SilentlyContinue 'dist', 'src/cli/types/pbtypes/fme/v1/fmev1connect', 'src/gui/src/gen'; Remove-Item -Force -ErrorAction SilentlyContinue 'src/cli/types/pbtypes/fme/v1/*.pb.go', 'src/cli/types/pbtypes/s3_shared/v1/*.pb.go'"
        {{else}}
        rm -rf dist src/cli/types/pbtypes/fme/v1/fmev1connect/ src/gui/src/gen/
        rm -f src/cli/types/pbtypes/fme/v1/*.pb.go src/cli/types/pbtypes/s3_shared/v1/*.pb.go
        {{end}}
