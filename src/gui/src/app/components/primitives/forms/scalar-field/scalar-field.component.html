<div class="fme-scalar-field">
    <div class="fme-field-header">
        <span class="fme-field-label">
            {{ parameter().name }}
            @if (required()) {
                <span class="fme-required-marker" aria-label="required">*</span>
            }
            <span class="fme-field-type">{{ parameter().type }}</span>
        </span>

        @if (overridden()) {
            <span class="fme-override-badge">
                overridden
                <button type="button" class="fme-revert" (click)="revert()">revert</button>
            </span>
        }
    </div>

    @switch (parameter().type) {
        @case ('bool') {
            <label class="fme-scalar-toggle-label">
                <input class="fme-scalar-toggle" type="checkbox"
                       [attr.aria-label]="parameter().name"
                       [checked]="checked()"
                       (change)="onToggle($any($event.target).checked)" />
                <span>{{ checked() ? 'true' : 'false' }}</span>
            </label>
        }
        @case ('enum') {
            <select class="fme-scalar-select"
                    [class.fme-invalid]="error() !== null"
                    [attr.aria-label]="parameter().name"
                    [value]="value()"
                    (change)="onText($any($event.target).value)">
                @if (!required()) {
                    <option value=""></option>
                }
                @for (opt of enumValues(); track opt) {
                    <option [value]="opt">{{ opt }}</option>
                }
            </select>
        }
        @case ('int') {
            <input class="fme-scalar-input" type="number" [step]="numberStep()"
                   [class.fme-invalid]="error() !== null"
                   [attr.aria-label]="parameter().name"
                   [value]="value()"
                   (input)="onText($any($event.target).value)" />
        }
        @case ('float') {
            <input class="fme-scalar-input" type="number" [step]="numberStep()"
                   [class.fme-invalid]="error() !== null"
                   [attr.aria-label]="parameter().name"
                   [value]="value()"
                   (input)="onText($any($event.target).value)" />
        }
        @default {
            <input class="fme-scalar-input" type="text"
                   [class.fme-invalid]="error() !== null"
                   [attr.aria-label]="parameter().name"
                   [value]="value()"
                   (input)="onText($any($event.target).value)" />
        }
    }

    @if (error() !== null) {
        <p class="fme-field-error">{{ error() }}</p>
    }
</div>
