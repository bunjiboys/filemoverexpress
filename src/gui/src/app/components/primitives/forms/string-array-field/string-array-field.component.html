<div class="fme-string-array-field">
    <div class="fme-field-header">
        <span class="fme-field-type-badge">{{ parameter().type }}</span>

        @if (overridden()) {
            <span class="fme-override-badge">
                overridden
                <button type="button" mat-button class="fme-revert" (click)="revert()">revert</button>
            </span>
        }
    </div>

    <div class="fme-field-row">
        <mat-form-field class="fme-chip-field" color="accent" appearance="outline" subscriptSizing="dynamic">
            <mat-label>
                {{ parameter().name }}
                @if (required()) {
                    <span class="fme-required-marker" aria-label="required">*</span>
                }
            </mat-label>
            <mat-chip-grid #chipGrid [attr.aria-label]="parameter().name">
                @for (value of values(); track value; let i = $index) {
                    <mat-chip-row class="fme-chip" [title]="value" (removed)="removeAt(i)">
                        {{ leafName(value) }}
                        <button matChipRemove [attr.aria-label]="'Remove ' + value">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-chip-row>
                }
                <input placeholder="Type a path and press Enter"
                       [attr.aria-label]="'Add a path for ' + parameter().name"
                       [(ngModel)]="entry"
                       [matChipInputFor]="chipGrid"
                       (matChipInputTokenEnd)="addEntry()" />
            </mat-chip-grid>

            <button matSuffix mat-button="filled" class="fme-browse-trigger" (click)="browse()">
                <mat-icon>folder_open</mat-icon>
                <span>Browse</span>
            </button>
        </mat-form-field>

    </div>

    @if (error() !== null) {
        <p class="fme-field-error">{{ error() }}</p>
    }
</div>
