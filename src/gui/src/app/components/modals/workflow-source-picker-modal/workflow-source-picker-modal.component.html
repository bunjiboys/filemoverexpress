<h2 mat-dialog-title class="fme-source-picker-title">
    <span>Select sources</span>
    <button mat-icon-button aria-label="Close" mat-dialog-close class="fme-source-picker-close">
        <mat-icon>close</mat-icon>
    </button>
</h2>

<div mat-dialog-content class="fme-source-picker">
    <p class="fme-source-picker-hint">
        Navigate and select one or more paths. Click, shift-click a range, or cmd/ctrl-click to toggle.
    </p>

    @if (favoritePaths().length > 0) {
        <label class="fme-source-picker-favorites">
            <span class="fme-source-picker-favorites-label">Favorites</span>
            <select class="fme-source-picker-favorites-select"
                    aria-label="Jump to a favorite path"
                    (change)="goToFavorite($any($event.target).value); $any($event.target).value = ''">
                <option value="">Jump to a favorite path...</option>
                @for (fav of favoritePaths(); track fav) {
                    <option [value]="fav">{{ fav }}</option>
                }
            </select>
        </label>
    }

    <div class="fme-source-picker-browser">
        <fme-file-browser
            fileBrowserType="unknown"
            fileBrowserID="workflow-source-picker"
            [isRoot]="isRoot"
            [currentDirectory]="currentDirectory"
            [fileBrowserData]="fileBrowserData"
            [allowExternalDragOver]="false"
            [contextMenuData]="[]"
            (fileBrowserNavigate)="onNavigate($event)">
        </fme-file-browser>
    </div>
</div>

<div mat-dialog-actions class="fme-source-picker-footer">
    <span class="fme-source-picker-count">{{ selectedCount() }} selected</span>
    <div class="fme-source-picker-actions">
        <button type="button" class="fme-source-picker-cancel" (click)="cancel()">Cancel</button>
        <button type="button" class="fme-source-picker-add"
                [disabled]="selectedCount() === 0"
                (click)="addSelected()">
            Add selected
        </button>
    </div>
</div>
