syntax = "proto3";

package fme.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/awslabs/filemoverexpress/protobuf";

// Workflow runner RPC surface (design: docs/designs/workflows/Workflow-Runner-GUI.md). The GUI opens an
// externally-authored workflow file, prompts the user for its declared
// spec.parameters, and submits the raw document plus the collected parameter values to
// the daemon. The daemon owns everything else: it parses the document, resolves the
// ${params.*} references, validates (schema, DAG acyclicity, id uniqueness, profile
// existence), schedules, and executes. The GUI never resolves parameters locally.
//
// Progress is observed over the EXISTING event stream (ListEvents) and job surface
// (ListJobs / ListTasksForJob*): a workflow's steps emit the current JobProgressEvent /
// JobCompleteEvent tagged with the run id, so no new progress message is defined here.

// How to parse the raw document text in a request. YAML is accepted as input; JSON is
// the canonical form (format doc, decision 1). The daemon parses YAML to JSON and
// validates one schema for both.
enum WorkflowFormat {
    WORKFLOW_FORMAT_UNSPECIFIED = 0;
    WORKFLOW_FORMAT_YAML = 1;
    WORKFLOW_FORMAT_JSON = 2;
}

// A single parameter value supplied by the user for a run. Carried as a string and
// coerced to the parameter's declared type (string/int/float/bool/enum) by the daemon
// during resolution, mirroring the CLI's `--param k=v` form. Keeping coercion
// daemon-side means there is exactly one place that interprets parameter types.
//
// A map<string, string> would be the terser encoding; a repeated message is used
// instead so a value can later carry provenance (was it the file default or a user
// override) without a breaking change, and so an explicitly-empty string value is
// distinguishable in tooling.
message WorkflowParamValue {
    // The declared parameter name (matches ^[A-Za-z_][A-Za-z0-9_]*$).
    string name = 1;
    // The value as a string, coerced daemon-side to the parameter's declared type.
    // For a bool parameter this is "true" / "false". Used for the scalar parameter
    // types (string/int/float/bool/enum); empty for a string_array (see `values`).
    string value = 2;
    // The ordered element values for a string_array parameter. A string_array supplies
    // its value here instead of in `value`, so a multi-source selection is carried as
    // discrete elements rather than a delimited string (which would be ambiguous against
    // a path containing the delimiter). Empty for a scalar parameter. Each element is
    // coerced/validated daemon-side; when the parameter declares a `pattern`, every
    // element must match. See docs/designs/workflows/Workflow-File-Format.md.
    repeated string values = 3;
}

// One validation failure, returned by ValidateWorkflow (and by a rejected RunWorkflow)
// so the GUI can point the user at the offending field or step. These are produced by
// the daemon's validator, which is authoritative; the GUI's own pre-flight checks are
// UX only.
message WorkflowValidationError {
    // Which category this error belongs to, so the GUI can route a parameter error to
    // its form field versus a document-level error to a banner.
    WorkflowValidationErrorKind kind = 1;
    // The declared parameter name, when kind == PARAMETER; empty otherwise.
    string parameter = 2;
    // The step id, when the error concerns a specific step (dangling dependsOn,
    // missing transfer profile on a step); empty otherwise.
    string step_id = 3;
    // Human-readable message describing the failure.
    string message = 4;
}

enum WorkflowValidationErrorKind {
    WORKFLOW_VALIDATION_ERROR_KIND_UNSPECIFIED = 0;
    // A declared parameter was missing/required, out of range, failed its pattern, or
    // was not a member of its enum values.
    WORKFLOW_VALIDATION_ERROR_KIND_PARAMETER = 1;
    // The document failed JSON Schema validation (shape, unknown field in strict mode,
    // bad enum/type in a step payload).
    WORKFLOW_VALIDATION_ERROR_KIND_SCHEMA = 2;
    // The dependency graph is invalid: a cycle, a dangling dependsOn id, or a
    // duplicate step id.
    WORKFLOW_VALIDATION_ERROR_KIND_GRAPH = 3;
    // A referenced transfer profile does not exist on the daemon (preflight).
    WORKFLOW_VALIDATION_ERROR_KIND_PROFILE = 4;
    // The document's apiVersion is outside the daemon's supported range.
    WORKFLOW_VALIDATION_ERROR_KIND_VERSION = 5;
}

// Submit a workflow for execution. The daemon resolves parameters, validates, and runs
// the whole document as one unit; it returns immediately with a run handle, and
// progress follows on the event stream.
message RunWorkflowRequest {
    // The raw workflow file text, exactly as authored (not pre-resolved by the GUI).
    string document = 1;
    // How to parse `document`.
    WorkflowFormat format = 2;
    // The user-supplied parameter values (file defaults, as edited/overridden in the
    // prompt). A parameter the user left at its file default is still sent with that
    // default's value; an optional parameter with no value may be omitted.
    repeated WorkflowParamValue params = 3;
}

message RunWorkflowResponse {
    // Whether the run was accepted and started. False means it was rejected before any
    // step ran (see `errors`); no run was created.
    bool accepted = 1;
    // The run handle, when accepted. Used to scope ListJobs / ListEvents /
    // ListTasksForJob* to this run's steps. Empty when not accepted.
    string run_id = 2;
    // Fail-fast validation errors when the run was rejected (accepted == false). Empty
    // on acceptance.
    repeated WorkflowValidationError errors = 3;
}

// Validate a workflow without executing it (format doc: `fme workflow validate`). Runs
// the same schema + reference + resolve-with-these-params checks the daemon applies
// before a run, so the GUI can offer a "Validate" action distinct from "Run".
message ValidateWorkflowRequest {
    string document = 1;
    WorkflowFormat format = 2;
    // The parameter values to validate against. On a parameterized file this is
    // required to validate concretely; absent values fall back to declared defaults,
    // and a still-unresolved required parameter is reported as a PARAMETER error.
    repeated WorkflowParamValue params = 3;
}

message ValidateWorkflowResponse {
    // True when the document (resolved with `params`) would be accepted for a run.
    bool valid = 1;
    // Every validation failure found; empty when valid.
    repeated WorkflowValidationError errors = 2;
}

// ============================================================================
// Run lifecycle & state (design: docs/designs/workflows/Workflow-File-Format.md,
// "Run lifecycle, state management, and persistence"). A submitted workflow becomes a
// WorkflowRun the daemon owns from acceptance to a terminal state. Run state is a layer
// ABOVE the per-job state the job manager tracks; a run owns the jobs its Job steps
// create (linked by Job.workflow_run_id). Run state is persisted (bbolt, transition-only)
// so runs survive a restart; see the format doc for reconciliation semantics.
// ============================================================================

// A step's status within a run. Step status is the finer-grained truth; run status is
// derived from the set of step statuses.
enum WorkflowStepStatus {
    WORKFLOW_STEP_STATUS_UNSPECIFIED = 0;
    // Declared, not yet eligible (a dependsOn is unmet).
    WORKFLOW_STEP_STATUS_PENDING = 1;
    // Eligible and executing (its executor is active).
    WORKFLOW_STEP_STATUS_RUNNING = 2;
    // Completed without error.
    WORKFLOW_STEP_STATUS_SUCCEEDED = 3;
    // The executor returned an error.
    WORKFLOW_STEP_STATUS_FAILED = 4;
    // A transitive dependency failed, or the run was cancelled before this step started.
    WORKFLOW_STEP_STATUS_SKIPPED = 5;
}

// A run's overall status. PENDING/RUNNING/SUCCEEDED/FAILED are derived from step
// statuses; PAUSED and CANCELLED are set directly by the user. SUCCEEDED/FAILED/CANCELLED
// are terminal.
enum WorkflowRunStatus {
    WORKFLOW_RUN_STATUS_UNSPECIFIED = 0;
    // Accepted and validated, not yet scheduling.
    WORKFLOW_RUN_STATUS_PENDING = 1;
    // At least one step is running or still reachable-and-pending.
    WORKFLOW_RUN_STATUS_RUNNING = 2;
    // The user paused the run; the scheduler is gated.
    WORKFLOW_RUN_STATUS_PAUSED = 3;
    // Every step reached SUCCEEDED (or SKIPPED under continueOnError). Terminal.
    WORKFLOW_RUN_STATUS_SUCCEEDED = 4;
    // At least one step FAILED without continueOnError. Terminal.
    WORKFLOW_RUN_STATUS_FAILED = 5;
    // The user cancelled the run before it reached a terminal state. Terminal.
    WORKFLOW_RUN_STATUS_CANCELLED = 6;
}

// One step within a run, as surfaced to a client. The design-time step id is `step_id`
// (distinct from any runtime job id); `job_id` links to the runtime Job a Job step
// created, empty for non-Job steps or before the job exists.
message WorkflowStep {
    string step_id = 1;
    string name = 2;
    string type = 3;
    WorkflowStepStatus status = 4;
    // The runtime job this step created (Job steps only); empty otherwise.
    string job_id = 5;
    // Error message when status == FAILED; empty otherwise.
    string error = 6;
}

// A run record as returned by ListWorkflowRuns. This mirrors the persisted run state
// (one self-contained record per run id in the store), so the same shape serves both
// the API and the bbolt/SQLite row.
message WorkflowRun {
    string run_id = 1;
    // The workflow's metadata.name, for display.
    string name = 2;
    WorkflowRunStatus status = 3;
    repeated WorkflowStep steps = 4;
    google.protobuf.Timestamp created = 5;
    google.protobuf.Timestamp started = 6;
    google.protobuf.Timestamp completed = 7;
}

message ListWorkflowRunsRequest {}

message ListWorkflowRunsResponse {
    repeated WorkflowRun runs = 1;
}

// Cancel a whole run: stop scheduling, skip not-yet-started steps, and cancel in-flight
// jobs. Idempotent once the run is terminal.
message CancelWorkflowRunRequest {
    string run_id = 1;
}

message CancelWorkflowRunResponse {
    string run_id = 1;
    bool success = 2;
    // Set when the run id is unknown or already terminal; empty on success.
    string error = 3;
}

// Pause a whole run: gate the scheduler so no new steps start. The user chooses whether
// in-flight jobs are also paused.
message PauseWorkflowRunRequest {
    string run_id = 1;
    // false (default): gate the scheduler only; steps already running finish normally.
    // true: additionally pause each in-flight Job step's job (via the existing PauseJob
    // path). Non-job in-flight steps (Sleep/Checksum/InventoryReport) have no pause
    // primitive and run to completion either way.
    bool pause_in_flight_jobs = 2;
}

message PauseWorkflowRunResponse {
    string run_id = 1;
    bool success = 2;
    string error = 3;
}

// Resume a paused run: un-gate the scheduler and resume any jobs paused by a
// pause_in_flight_jobs pause.
message ResumeWorkflowRunRequest {
    string run_id = 1;
}

message ResumeWorkflowRunResponse {
    string run_id = 1;
    bool success = 2;
    string error = 3;
}

// Delete a run record from the persisted store. Only a TERMINAL run (SUCCEEDED / FAILED /
// CANCELLED) may be deleted; deleting a run that is still PENDING / RUNNING / PAUSED is
// refused via the error field so an in-flight run is never dropped out from under the
// engine. Deleting an unknown id is also reported in error.
message DeleteWorkflowRunRequest {
    string run_id = 1;
}

message DeleteWorkflowRunResponse {
    string run_id = 1;
    bool success = 2;
    // Set when the run id is unknown or not terminal; empty on success.
    string error = 3;
}

// ---- Run lifecycle events (carried over the existing ListEvents stream) ----
// These are run-level STATE TRANSITIONS, not progress ticks. Byte progress continues to
// ride JobProgressEvent tagged with workflow_run_id / workflow_step_id.

// A run was accepted and scheduling began.
message WorkflowRunStartedEvent {
    string run_id = 1;
    string name = 2;
    google.protobuf.Timestamp started = 3;
}

// A run's overall status changed (e.g. RUNNING->PAUSED, ->CANCELLED, ->terminal).
message WorkflowRunStatusChangeEvent {
    string run_id = 1;
    WorkflowRunStatus status = 2;
    google.protobuf.Timestamp timestamp = 3;
}

// A step within a run changed status.
message WorkflowStepStatusChangeEvent {
    string run_id = 1;
    string step_id = 2;
    WorkflowStepStatus status = 3;
    google.protobuf.Timestamp timestamp = 4;
}

// A run reached a terminal state (SUCCEEDED / FAILED / CANCELLED).
message WorkflowRunCompleteEvent {
    string run_id = 1;
    string name = 2;
    WorkflowRunStatus status = 3;
    google.protobuf.Timestamp completed = 4;
}
