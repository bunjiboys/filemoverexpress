version: '3'

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    run: once
    cmds:
      - go mod tidy

  build:frontend:
    summary: Build the frontend project
    run: once
    dir: ../gui
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
    cmds:
      - npx ng build --configuration production

  install:frontend:deps:
    summary: Install frontend dependencies
    run: once
    dir: ../gui
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules
    cmds:
      - npm install

  generate:bindings:
    summary: Generates bindings for the frontend
    run: once
    deps:
      - task: go:mod:tidy
    cmds:
      - wails3 generate bindings -clean=true -ts -d ../gui/src/gen/wails

  generate:icons:
    summary: Generates Windows .ico and Mac .icns from appicon.png
    run: once
    dir: build
    sources:
      - "appicon.png"
    generates:
      - "darwin/icons.icns"
      - "windows/icon.ico"
    cmds:
      - wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icon.ico

  dev:frontend:
    summary: Runs the frontend in development mode (binds the wails3 dev vite port for HMR proxying)
    dir: ../gui
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
    cmds:
      # Bind to the exact port wails3 dev proxies (WAILS_VITE_PORT, default 4200) on IPv4 so
      # the dev proxy's forced tcp4 localhost dial connects, and so ng serve fails fast if the
      # port is taken (the strictPort behaviour Wails relies on) instead of drifting ports.
      - npx ng serve --configuration development --host 127.0.0.1 --port {{.WAILS_VITE_PORT | default 4200}}

  update:build-assets:
    summary: Updates the build assets
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .
